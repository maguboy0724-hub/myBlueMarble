<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>우리 가족 부루마블</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="board-container" id="board">
    
    <!-- 중앙 패널: 게임 진행 UI 및 주사위 화면 -->
    <div class="center-panel" id="center-panel">
      
      <!-- 1. 플레이어 설정 화면 (최초 화면) -->
      <div id="setup-screen">
        <h1 style="text-align:center; margin-bottom: 10px;">부루마블</h1>
        <p style="margin-bottom: 20px;">플레이어를 확인하고 게임을 시작하세요.</p>
        
        <div id="player-setup">
          <div class="draggable-item" draggable="true">
            <span class="drag-handle">⠿</span>
            <select class="player-char" style="margin-right: 5px; font-size: 1.2rem; border: none; background: transparent; cursor: pointer;">
              <option value="🍄" selected>🍄</option>
              <option value="🐢">🐢</option>
              <option value="👸">👸</option>
              <option value="🦖">🦖</option>
              <option value="🌟">🌟</option>
              <option value="🐲">🐲</option>
            </select>
            <input type="text" value="아빠" class="player-input">
          </div>
          <div class="draggable-item" draggable="true">
            <span class="drag-handle">⠿</span>
            <select class="player-char" style="margin-right: 5px; font-size: 1.2rem; border: none; background: transparent; cursor: pointer;">
              <option value="🍄">🍄</option>
              <option value="🐢" selected>🐢</option>
              <option value="👸">👸</option>
              <option value="🦖">🦖</option>
              <option value="🌟">🌟</option>
              <option value="🐲">🐲</option>
            </select>
            <input type="text" value="엄마" class="player-input">
          </div>
          <div class="draggable-item" draggable="true">
            <span class="drag-handle">⠿</span>
            <select class="player-char" style="margin-right: 5px; font-size: 1.2rem; border: none; background: transparent; cursor: pointer;">
              <option value="🍄">🍄</option>
              <option value="🐢">🐢</option>
              <option value="👸" selected>👸</option>
              <option value="🦖">🦖</option>
              <option value="🌟">🌟</option>
              <option value="🐲">🐲</option>
            </select>
            <input type="text" value="시현" class="player-input">
          </div>
          <div class="draggable-item" draggable="true">
            <span class="drag-handle">⠿</span>
            <select class="player-char" style="margin-right: 5px; font-size: 1.2rem; border: none; background: transparent; cursor: pointer;">
              <option value="🍄">🍄</option>
              <option value="🐢">🐢</option>
              <option value="👸">👸</option>
              <option value="🦖" selected>🦖</option>
              <option value="🌟">🌟</option>
              <option value="🐲">🐲</option>
            </select>
            <input type="text" value="강현" class="player-input">
          </div>
        </div>

        <div style="margin: 15px 0; font-size: 0.9rem;">
          <label style="margin-right: 15px; cursor: pointer;">
            <input type="radio" name="gameMode" value="normal" checked> 일반 모드<br><span style="font-size: 0.8rem; color: #666;">(오프라인 지폐 사용, 돈 표시 안함)</span>
          </label>
          <label style="cursor: pointer;">
            <input type="radio" name="gameMode" value="auto"> 자동 모드<br><span style="font-size: 0.8rem; color: #666;">(앱에서 돈 계산 및 표시)</span>
          </label>
        </div>
        
        <div style="margin-bottom: 20px; font-size: 0.9rem; text-align: center;">
          <p style="margin-bottom: 8px; font-weight: bold; color: #333;">시작 자금</p>
          <label style="margin-right: 10px; cursor: pointer;"><input type="radio" name="startMoney" value="300"> 300만</label>
          <label style="margin-right: 10px; cursor: pointer;"><input type="radio" name="startMoney" value="400"> 400만</label>
          <label style="cursor: pointer;"><input type="radio" name="startMoney" value="500" checked> 500만</label>
        </div>

        <button class="start-btn" onclick="startGame()">게임 시작</button>
      </div>

      <!-- 2. 점수판 (게임 시작 시 등장) -->
      <div id="scoreboard" style="display: none; width: 90%; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; font-weight: bold; font-size: 1.8rem;">
        <span id="score-0">아빠: 500만</span>
        <span id="score-1">엄마: 500만</span>
        <span id="score-2">시현: 500만</span>
        <span id="score-3">강윤: 500만</span>
      </div>

      <!-- 3. 주사위 입력 화면 -->
      <div id="dice-screen" style="display: none; text-align: center; width: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <button onclick="rollbackTurn()" style="padding: 5px 10px; font-size: 0.9rem; cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 5px;">⬅️ 되돌리기</button>
          <h2 id="turn-indicator" style="margin: 0; color: #333;">누구의 턴?</h2>
          <button onclick="forwardTurn()" style="padding: 5px 10px; font-size: 0.9rem; cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 5px;">앞으로 ➡️</button>
        </div>
        
        <p id="dice1-label" style="margin-bottom: 10px;">주사위 1</p>
        <div class="dice-row" id="dice1-row">
          <button onclick="selectDice(1, 1)">1</button>
          <button onclick="selectDice(1, 2)">2</button>
          <button onclick="selectDice(1, 3)">3</button>
          <button onclick="selectDice(1, 4)">4</button>
          <button onclick="selectDice(1, 5)">5</button>
          <button onclick="selectDice(1, 6)">6</button>
        </div>

        <p id="dice2-label" style="margin-top: 15px; margin-bottom: 10px;">주사위 2</p>
        <div class="dice-row" id="dice2-row">
          <button onclick="selectDice(2, 1)">1</button>
          <button onclick="selectDice(2, 2)">2</button>
          <button onclick="selectDice(2, 3)">3</button>
          <button onclick="selectDice(2, 4)">4</button>
          <button onclick="selectDice(2, 5)">5</button>
          <button onclick="selectDice(2, 6)">6</button>
        </div>

        <div id="auto-dice-container" style="display: none; margin-top: 60px;">
          <button id="auto-roll-btn" class="auto-roll-btn" onclick="autoRollDice()">🎲<br>굴리기</button>
        </div>

        <button id="move-btn" style="display:none; margin-top: 20px;" class="start-btn" onclick="movePlayer()">이동하기!</button>
      </div>

      <!-- 4. 땅 도착 액션 화면 (말 이동 완료 시 등장) -->
      <div id="action-screen" style="display: none; text-align: center; width: 100%;">
        <h2 id="action-title" style="color: #333; margin-bottom: 10px;">도착한 땅 이름</h2>
        <p id="action-desc" style="font-size: 1.2rem; margin-bottom: 20px;">주인이 없는 땅입니다.</p>
        <div id="action-buttons">
          <!-- JS에서 동적으로 버튼을 넣어줍니다 -->
        </div>
      </div>

    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div id="custom-alert" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <p id="custom-alert-msg"></p>
      <button class="start-btn" onclick="closeCustomAlert()">확인</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
